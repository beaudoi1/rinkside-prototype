<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rinkside — Log In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,300&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --rink-dark: #0b1824; --rink-panel: #182f42;
    --accent: #38bdf8; --text-primary: #f0f8ff; --text-muted: #7fa9c0; --text-dim: #7aa3b8;
    --border: rgba(56,189,248,0.12); --border-mid: rgba(56,189,248,0.22);
    --font-display: 'Syne', sans-serif; --font-body: 'DM Sans', sans-serif;
    --radius-sm: 10px; --red: #f87171;
  }
  body { font-family: var(--font-body); background: var(--rink-dark); color: var(--text-primary); min-height: 100vh; }
  .page { max-width: 420px; margin: 0 auto; padding: 0 0 40px; }
  .topbar { display: flex; align-items: center; gap: 14px; padding: 20px 20px 16px; border-bottom: 1px solid var(--border); }
  .back-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--rink-panel); border: 1px solid var(--border-mid); display: flex; align-items: center; justify-content: center; color: var(--text-primary); text-decoration: none; flex-shrink: 0; }
  .back-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .topbar h1 { font-family: var(--font-display); font-size: 19px; font-weight: 700; }
  .content { padding: 24px 20px; }

  .field { margin-bottom: 20px; }
  .field label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-dim); margin-bottom: 8px; }
  .field input { width: 100%; padding: 14px 16px; border-radius: var(--radius-sm); border: 1.5px solid var(--border-mid); background: var(--rink-panel); color: var(--text-primary); font-family: var(--font-body); font-size: 14px; }
  .field input::placeholder { color: var(--text-dim); }
  .field input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .field-error { font-size: 11px; color: var(--red); margin-top: 6px; display: none; }
  .field.invalid input { border-color: var(--red); }
  .field.invalid .field-error { display: block; }

  .pw-row { position: relative; }
  .pw-toggle { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); font-size: 11px; font-weight: 600; cursor: pointer; font-family: var(--font-body); }
  .pw-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .forgot-link { display: block; text-align: right; font-size: 12px; color: var(--accent); font-weight: 600; text-decoration: none; margin-top: -10px; margin-bottom: 20px; }
  .forgot-link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .submit-btn { width: 100%; padding: 16px; border-radius: var(--radius-sm); background: var(--text-primary); color: var(--rink-dark); border: none; font-weight: 700; font-size: 15px; cursor: pointer; }
  .submit-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .signup-link { font-size: 12px; color: var(--text-muted); font-weight: 500; text-align: center; margin-top: 24px; }
  .signup-link a { color: var(--accent); font-weight: 700; text-decoration: none; }

  .btn-outline { display: block; width: 100%; padding: 13px; border-radius: var(--radius-sm); font-family: var(--font-body); font-weight: 600; font-size: 13px; cursor: pointer; text-decoration: none; margin-bottom: 10px; text-align: center; background: none; border: 1.5px solid var(--border-mid); color: var(--text-primary); }
  .btn-outline:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .divider { display: flex; align-items: center; gap: 12px; margin: 18px 0 22px; }
  .divider::before, .divider::after { content:''; flex:1; height:1px; background: var(--border-mid); }
  .divider span { font-size: 11px; color: var(--text-dim); white-space: nowrap; }

  /* ============ RESPONSIVE: PRE-AUTH WIDTH CAP ============ */
  @media (min-width: 768px) {
    .page { max-width: 480px; margin: 0 auto; }
  }
  /* ============ END RESPONSIVE ============ */

<!-- RESPONSIVE-INJECTED -->
</style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <a class="back-btn" href="rinkside-welcome.html" aria-label="Back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></a>
    <h1>Log In</h1>
  </div>

  <div class="content">
    <a class="btn-outline" href="#" onclick="return false" aria-disabled="true">Continue with Google</a>
    <a class="btn-outline" href="#" onclick="return false" aria-disabled="true">Continue with Apple</a>
    <a class="btn-outline" href="#" onclick="return false" aria-disabled="true">Continue with Facebook</a>

    <div class="divider"><span>or log in with email</span></div>

    <form onsubmit="return handleSubmit(event)">
      <div class="field" id="email-field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@email.com" required>
        <p class="field-error">We don't recognize that email or password</p>
      </div>
      <div class="field pw-row">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required>
        <button type="button" class="pw-toggle" onclick="togglePw()">Show</button>
      </div>
      <a href="#" class="forgot-link" onclick="return false">Forgot password?</a>
      <button type="submit" class="submit-btn">Log In</button>
    </form>
    <p class="signup-link">Don't have an account? <a href="rinkside-signup.html">Sign up</a></p>
  </div>
</div>

<script>
  function togglePw() {
    const pw = document.getElementById('password');
    const btn = document.querySelector('.pw-toggle');
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    btn.textContent = show ? 'Hide' : 'Show';
  }
  function handleSubmit(e) {
    e.preventDefault();
    // Prototype: any non-empty input logs in successfully
    window.location.href = 'rinkside-home.html';
    return false;
  }
</script>
</body>
</html>
